services:
  db-init:
    image: mysql:8.4
    restart: "no"
    environment:
      DB_HOST: ${MYSQL_RDS_HOST:?Set MYSQL_RDS_HOST to the RDS endpoint}
      DB_PORT: ${MYSQL_RDS_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME for RDS}
      MYSQL_PWD: ${DB_PASSWORD:?Set DB_PASSWORD for RDS}
    volumes:
      - ./cloud/mysql/init/01-create-databases.sql:/init/01-create-databases.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempts=0
        until mysqladmin ping --host="$$DB_HOST" --port="$$DB_PORT" --user="$$DB_USERNAME" --silent; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 60 ]; then
            echo "RDS did not become available within five minutes." >&2
            exit 1
          fi
          sleep 5
        done
        mysql --host="$$DB_HOST" --port="$$DB_PORT" --user="$$DB_USERNAME" < /init/01-create-databases.sql
    networks: [ibms-net]

  auth-service:
    image: ibms/auth-service:local
    build: ./auth-service
    restart: unless-stopped
    environment:
      DB_HOST: ${MYSQL_RDS_HOST:?Set MYSQL_RDS_HOST to the RDS endpoint}
      DB_PORT: ${MYSQL_RDS_PORT:-3306}
      DB_NAME: auth_db
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME for RDS}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for RDS}
      JPA_SHOW_SQL: "false"
    depends_on:
      db-init: { condition: service_completed_successfully }
    networks: [ibms-net]

  transaction-service:
    image: ibms/transaction-service:local
    build: ./transaction-service
    restart: unless-stopped
    environment:
      DB_HOST: ${MYSQL_RDS_HOST:?Set MYSQL_RDS_HOST to the RDS endpoint}
      DB_PORT: ${MYSQL_RDS_PORT:-3306}
      DB_NAME: transaction_db
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME for RDS}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for RDS}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      JPA_SHOW_SQL: "false"
    depends_on:
      db-init: { condition: service_completed_successfully }
      auth-service: { condition: service_started }
    networks: [ibms-net]

  notification-service:
    image: ibms/notification-service:local
    build: ./notification-service
    restart: unless-stopped
    environment:
      DB_HOST: ${MYSQL_RDS_HOST:?Set MYSQL_RDS_HOST to the RDS endpoint}
      DB_PORT: ${MYSQL_RDS_PORT:-3306}
      DB_NAME: notification_db
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME for RDS}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for RDS}
      JPA_SHOW_SQL: "false"
    depends_on:
      db-init: { condition: service_completed_successfully }
    networks: [ibms-net]

  loan-service:
    image: ibms/loan-service:local
    build: ./loan-service
    restart: unless-stopped
    environment:
      DB_HOST: ${MYSQL_RDS_HOST:?Set MYSQL_RDS_HOST to the RDS endpoint}
      DB_PORT: ${MYSQL_RDS_PORT:-3306}
      DB_NAME: loan_db
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME for RDS}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for RDS}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8083}
      JPA_SHOW_SQL: "false"
    depends_on:
      db-init: { condition: service_completed_successfully }
      notification-service: { condition: service_started }
    networks: [ibms-net]

  api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./cloud/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service: { condition: service_started }
      transaction-service: { condition: service_started }
      notification-service: { condition: service_started }
      loan-service: { condition: service_started }
    networks: [ibms-net]

networks:
  ibms-net:
    driver: bridge
