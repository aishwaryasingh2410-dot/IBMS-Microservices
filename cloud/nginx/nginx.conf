events {}

http {
    upstream auth_service { server auth-service:8081; }
    upstream transaction_service { server transaction-service:8082; }
    upstream notification_service { server notification-service:8083; }
    upstream loan_service { server loan-service:8084; }

    server {
        listen 80;
        server_name _;

        location /auth/ { proxy_pass http://auth_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /accounts { proxy_pass http://transaction_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /transactions { proxy_pass http://transaction_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /notifications { proxy_pass http://notification_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /loans { proxy_pass http://loan_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

        location /health {
            return 200 'IBMS cloud gateway is running';
            add_header Content-Type text/plain;
        }
    }
}
