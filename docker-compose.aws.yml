services:
  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      DB_HOST: ${MYSQL_RDS_HOST}
      DB_PORT: 3306
      DB_NAME: auth_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_SHOW_SQL: "false"
    networks: [ibms-net]

  transaction-service:
    build: ./transaction-service
    restart: unless-stopped
    environment:
      DB_HOST: ${MYSQL_RDS_HOST}
      DB_PORT: 3306
      DB_NAME: transaction_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8081
      JPA_SHOW_SQL: "false"
    depends_on: [auth-service]
    networks: [ibms-net]

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    environment:
      DB_HOST: ${MYSQL_RDS_HOST}
      DB_PORT: 3306
      DB_NAME: notification_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_SHOW_SQL: "false"
    networks: [ibms-net]

  loan-service:
    build: ./loan-service
    restart: unless-stopped
    environment:
      DB_HOST: ${MYSQL_RDS_HOST}
      DB_PORT: 3306
      DB_NAME: loan_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      JPA_SHOW_SQL: "false"
    depends_on: [notification-service]
    networks: [ibms-net]

  api-gateway:
    image: nginx:1.27-alpine
    container_name: ibms-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./cloud/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service: { condition: service_started }
      transaction-service: { condition: service_started }
      notification-service: { condition: service_started }
      loan-service: { condition: service_started }
    networks: [ibms-net]

networks:
  ibms-net:
    driver: bridge
