services:
  mysql:
    image: mysql:8.4
    container_name: ibms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ibmsroot}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./cloud/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ibms-net]

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: auth_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ibmsroot}
      JPA_SHOW_SQL: "false"
    depends_on:
      mysql: { condition: service_healthy }
    networks: [ibms-net]

  transaction-service:
    build: ./transaction-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: transaction_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ibmsroot}
      AUTH_SERVICE_URL: http://auth-service:8081
      JPA_SHOW_SQL: "false"
    depends_on:
      mysql: { condition: service_healthy }
      auth-service: { condition: service_started }
    networks: [ibms-net]

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: notification_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ibmsroot}
      JPA_SHOW_SQL: "false"
    depends_on:
      mysql: { condition: service_healthy }
    networks: [ibms-net]

  loan-service:
    build: ./loan-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: loan_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ibmsroot}
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      JPA_SHOW_SQL: "false"
    depends_on:
      mysql: { condition: service_healthy }
      notification-service: { condition: service_started }
    networks: [ibms-net]

  api-gateway:
    image: nginx:1.27-alpine
    container_name: ibms-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./cloud/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service: { condition: service_started }
      transaction-service: { condition: service_started }
      notification-service: { condition: service_started }
      loan-service: { condition: service_started }
    networks: [ibms-net]

volumes:
  mysql_data:

networks:
  ibms-net:
    driver: bridge
